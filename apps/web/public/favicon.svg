<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="fav-ball-body" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#1f4d37" />
      <stop offset="55%" stop-color="#10291d" />
      <stop offset="100%" stop-color="#08160f" />
    </radialGradient>

    <linearGradient id="fav-neon-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="45%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="fav-facet-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7a8" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.25" />
    </linearGradient>

    <radialGradient id="fav-ball-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <filter id="fav-ball-neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Pure circular ball without any square background tile -->
  <circle cx="60" cy="60" r="54" fill="url(#fav-ball-body)" />
  <circle cx="60" cy="60" r="48" fill="url(#fav-ball-core-glow)" />

  <g filter="url(#fav-ball-neon)">
    <circle
      cx="60"
      cy="60"
      r="54"
      fill="none"
      stroke="url(#fav-neon-stroke)"
      stroke-width="3.2"
    />

    <polygon
      points="60,35.5 79.5,49.5 72.1,72.5 47.9,72.5 40.5,49.5"
      fill="url(#fav-facet-glow)"
      stroke="url(#fav-neon-stroke)"
      stroke-width="3"
      stroke-linejoin="round"
    />

    <g stroke="url(#fav-neon-stroke)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <line x1="60" y1="35.5" x2="60" y2="7" />
      <line x1="79.5" y1="49.5" x2="105" y2="38" />
      <line x1="72.1" y1="72.5" x2="96" y2="93" />
      <line x1="47.9" y1="72.5" x2="24" y2="93" />
      <line x1="40.5" y1="49.5" x2="15" y2="38" />

      <path d="M33 13.5 L60 7 L87 13.5" fill="none" />
      <path d="M105 38 L111 63 L96 93" fill="none" />
      <path d="M15 38 L9 63 L24 93" fill="none" />
      <path d="M24 93 L60 108 L96 93" fill="none" />
    </g>

    <polygon points="15,38 40.5,49.5 33,13.5" fill="url(#fav-facet-glow)" opacity="0.5" />
    <polygon points="79.5,49.5 105,38 87,13.5" fill="url(#fav-facet-glow)" opacity="0.4" />
    <polygon points="47.9,72.5 72.1,72.5 60,108" fill="url(#fav-facet-glow)" opacity="0.35" />
  </g>
</svg>
